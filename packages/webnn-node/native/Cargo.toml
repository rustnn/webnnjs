[package]
name = "webnn-node-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16.13", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "2.16.13"
once_cell = "1.20.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = ["rt", "rt-multi-thread", "macros", "sync"] }
walkdir = "2.5.0"
prost = "0.12"
rustnn = { git = "https://github.com/rustnn/rustnn", branch = "main", features = ["onnx-runtime", "dynamic-inputs"] }

[build-dependencies]
napi-build = "2.1.4"

[package]
name = "webnn-node-native"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.0", default-features = false, features = [
	"napi8",
	"tokio_rt",
] }
napi-derive = "3.6.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.43.0", features = [
	"rt",
	"rt-multi-thread",
	"macros",
	"sync",
] }
walkdir = "2.5.0"
bytemuck = "1.21.0"
rustnn = { workspace = true }

[build-dependencies]
napi-build = "2.1.4"
